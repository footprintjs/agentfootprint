name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run on its previous head. Pushes to main
# are never cancelled: each one is a commit the Release workflow may cut.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# EVERY install here is `npm ci` against the committed lockfiles — the same
# tree the Release workflow gates and publishes. `npm install` would resolve
# fresh versions and let CI pass on a tree that never ships.
#
# This run's verdict is a release gate: when the release PR's run is green on
# the exact tree that merges, the Release workflow publishes without running
# the gates again (publish.yml · verdict, which reads `tested-tree` below). So
# every action here is pinned to a full commit SHA, as in publish.yml: a moved
# tag could otherwise report a tree as tested that never was. Renovate's
# github-actions manager proposes new pins.
jobs:
  file-size:
    uses: footprintjs/ci/.github/workflows/file-size.yml@0238fa6781697bd110a8ac3feea1fb58ddcc960b
    with:
      tool_sha: 0238fa6781697bd110a8ac3feea1fb58ddcc960b

  # Release hold, pull-request mode (footprintjs/ci docs/HOLD.md): while an open
  # issue or pull request carries the label `hold-release`, a pull request that
  # changes the package.json version (a release or heading pull request) fails
  # this job; every other pull request passes. Why: a release was once
  # published while another working session held it.
  #
  # Its own job, and NOT a dependency of any other job: the `test` and
  # `coverage` checks read the results of the jobs they need, and a hold must
  # never turn an ordinary check red. It does change one thing: a red `hold`
  # job makes this run's conclusion `failure`, and publish.yml's `verdict`
  # accepts only `success`, so a release pull request whose last run happened
  # during a hold makes `build` run every gate again after the hold is lifted.
  # That is safe (it costs minutes, never a release): `verdict` can only
  # decline to skip the gates, never accept. The `if:` is required: the mode refuses every event but
  # `pull_request`, and this workflow also runs on pushes to main.
  #
  # PIN: `uses:` and `tool_sha` are one reviewed footprintjs/ci commit and move
  # together, with the pins in publish.yml. `file-size` above pins an older
  # commit for another check.
  # `permissions:` is on the job, not at the top of the file.
  hold:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: footprintjs/ci/.github/workflows/hold.yml@b14f372d4c26e9f3059068b250544aa320b834aa
    with:
      tool_sha: b14f372d4c26e9f3059068b250544aa320b834aa
      mode: pull-request

  # WHAT A PULL REQUEST RUNS, AND WHAT WAITS FOR MAIN. An ordinary pull request
  # runs the test suite (`test-shard`) on Node 24 only and skips coverage. The
  # suite on Node 22 and coverage run on every push to main, on the release pull
  # request (`release/next`, whose run publish.yml's `verdict` reads as the
  # release gate) and on a dependency pull request (`renovate/*`, where a
  # Node-specific break is most likely). `test-package` still runs on both Node
  # versions on every pull request: the Release workflow's own fallback (`build`,
  # used for a release candidate and whenever `verdict` declines) runs the suite
  # itself but not every `test-package` command, so those must not reach main
  # untested on Node 22. Why narrow at all: coverage ran the whole suite a second
  # time and was the slowest thing a pull request waited for (measured 25 Nov
  # 2026: about 12 minutes with it; the slowest path left is a test shard, about
  # 9), and the Node 22 shards added four machines. The condition is written out
  # at each of the three places that use it, because a matrix and a job-level
  # `if:` cannot read a shared variable; test/docs/ci-test-shards.test.ts refuses
  # any two that differ. A job that does not run is SKIPPED: `coverage` is, and a
  # release cannot pass on it, because `verdict` accepts only `success`. The
  # required check names do not change; GitHub lets a pull request merge when a
  # required check was skipped by its `if:`.
  #
  # The test suite, split across machines: `--shard=i/N` hands each machine its
  # share of the test files, so all N together run every file exactly once.
  # Vitest splits by file count, not by time. To change N, edit the `shard` list
  # and the `/4` together; test/docs/ci-test-shards.test.ts refuses a mismatch.
  test-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard finishes, so one run shows every failure.
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON((github.event_name != 'pull_request' || github.head_ref == 'release/next' || startsWith(github.head_ref, 'renovate/')) && '[22, 24]' || '[24]') }}
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      # Build BEFORE test: tests and examples import from the package name
      # 'agentfootprint' (not relative paths), and Node's resolver looks up the
      # local package's main/exports, which point to dist/.
      - run: npm run build
      - run: npm test -- --shard=${{ matrix.shard }}/4

  # What runs around the test suite, on both Node versions: the contract, the
  # compiler and the package as it would ship.
  test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The `tested` step below reads the PR head, a parent of the tested merge.
          fetch-depth: 2

      # WHICH COMMIT THE PACKAGE EVIDENCE BELOW IS BOUND TO. This run tests one
      # tree: for a pull request, the merge of its head into main. When the head
      # already contains main, that tree IS the head's tree, and the evidence is
      # bound to the head commit, the name a downstream check knows. When main
      # has moved since, the two trees differ, and the evidence is bound to the
      # tested merge commit instead, under that commit's name. It used to fail
      # the job there, which made every open pull request need a base update
      # and a full rerun each time anything merged; nothing about the pull
      # request was wrong. The evidence never claims a tree this run did not
      # test. First in the job, before any dependency code runs.
      - name: Name the commit this run tested
        id: tested
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bound="$(git rev-parse HEAD)"
          if [ -n "$PR_HEAD" ] && [ "$(git rev-parse "$PR_HEAD^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            bound="$PR_HEAD"
          fi
          echo "commit=$bound" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Context package contract input and guard tests
        run: node --test scripts/context-package-contract/*.test.mjs scripts/publish-archive/candidate.test.mjs scripts/publish-archive/publishedDependency.test.mjs scripts/publish-archive/verify-staged-candidate.test.mjs

      - run: npm ci
      - run: npm ls foottrace
      - run: npm run test:contract:foottrace
      - run: npx tsc --noEmit
      # Compile-level regression tests (test/type-regressions/) — ordinary
      # `test/**` isn't covered by the tsc run above (tsconfig.json's
      # `include` is src/**/* only), so type-only assignability breaks (e.g.
      # a recorder handle drifting out of CombinedRecorder's shape) can slip
      # through even with the runtime suite green. Its own tsconfig runs the
      # real compiler over just these files.
      - run: npm run test:types
      - run: npm run build
      - run: npm run test:context-package
      # Packaging-correctness gate: dual CJS/ESM types resolve in every consumer mode.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      # One unchanged, source-bound package for downstream checks. This is a
      # retained CI artifact, never a publication or a version-staged archive.
      - name: Retain original source candidate
        if: matrix.node-version == 24
        env:
          SOURCE_HEAD: ${{ steps.tested.outputs.commit }}
        run: |
          mkdir "$RUNNER_TEMP/af-source-candidate"
          npm pack --ignore-scripts --offline --json --pack-destination "$RUNNER_TEMP/af-source-candidate" > "$RUNNER_TEMP/af-source-pack.json"
          node scripts/publish-archive/candidate.cjs "$RUNNER_TEMP/af-source-candidate" "$SOURCE_HEAD"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node-version == 24
        with:
          name: agentfootprint-source-${{ steps.tested.outputs.commit }}
          path: ${{ runner.temp }}/af-source-candidate/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Compare the same-run source and RC-staged packs
        if: matrix.node-version == 24
        run: node scripts/publish-archive/verify-staged-candidate.mjs "$RUNNER_TEMP/af-source-candidate"

      - name: Four strict native context roots and public producer identities
        id: native_context
        env:
          SOURCE_HEAD: ${{ steps.tested.outputs.commit }}
        run: node scripts/check-context-package-strict.mjs "$RUNNER_TEMP/af-strict-context" "$SOURCE_HEAD"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (steps.native_context.outcome == 'success' || steps.native_context.outcome == 'failure')
        with:
          name: agentfootprint-native-context-${{ matrix.node-version }}-${{ steps.tested.outputs.commit }}
          path: ${{ runner.temp }}/af-strict-context/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Every example, typechecked AND run end-to-end against mock providers — the
  # code people copy. Once per commit (on Node 22) is enough.
  test-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:examples

  # The required checks `test (22)` and `test (24)`, by those exact names: the
  # ruleset and publish.yml · verdict read them, and the matrix is here only to
  # give those two names. They run no tests. Each passes only when every job it
  # needs succeeded. On an ordinary pull request the suite ran on Node 24 only
  # (see above `test-shard`), so a green `test (22)` there says the package checks
  # passed on Node 22, not the suite; a full run puts the Node 22 shards behind it.
  #
  # `if: always()` is what makes a failure count. Without it a failed shard SKIPS
  # this job, and GitHub reports a skipped job as Success, even on a required
  # check. With it this job runs whatever happened, and its step accepts nothing
  # but `success`: a failed, cancelled or skipped job behind it turns it red.
  # `needs.<job>.result` speaks for all the legs of a matrix at once, so a failure
  # on one Node version turns both checks red; the shard's own job names which.
  test:
    if: always()
    needs: [test-shard, test-package, test-examples]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Every job behind this check succeeded
        env:
          TEST_SHARD: ${{ needs.test-shard.result }}
          TEST_PACKAGE: ${{ needs.test-package.result }}
          TEST_EXAMPLES: ${{ needs.test-examples.result }}
        run: |
          echo "test-shard: $TEST_SHARD, test-package: $TEST_PACKAGE, test-examples: $TEST_EXAMPLES"
          [ "$TEST_SHARD" = success ] && [ "$TEST_PACKAGE" = success ] && [ "$TEST_EXAMPLES" = success ]

  # Also the two checks the Release workflow runs that nothing else in CI did —
  # a PR green here must not go red at release time.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - name: Documentation check (removed API names)
        run: bash scripts/check-docs.sh
      - name: Duplicate type check
        run: node scripts/check-dup-types.mjs
      # The layer table (scripts/layering.config.cjs): fails on ANY upward runtime import
      # (the fence is closed), on an upward type-only import not named in
      # TYPE_ONLY_ALLOWANCES or a stale entry there (the list only shrinks), on a folder
      # at two layers, on logic in a barrel, and on a value-level folder cycle.
      - name: Layering check
        run: npm run check:layering

  # Docs gate: builds docs-next (Fumadocs), which twoslash-compiles every
  # "ts twoslash" code block against the real agentfootprint types at build.
  # A snippet using a renamed/removed API fails the build -> hand-written doc
  # code can't drift from the library (test-examples runs every example).
  #
  # NOT on the release PR (release/next, from this repository — a fork's
  # branch of that name still runs it). The website does not gate npm: the
  # release PR changes no page and no library source (the version, CHANGELOG,
  # CAPABILITIES, lockfiles), and docs.yml builds and checks the site again
  # once npm has the version, where a failure delays only the website.
  # Skipped rather than run as non-blocking: GitHub documents that a job
  # skipped by `if:` reports Success and does not block a merge even when it
  # is a required check, so the release PR shows no red site check to stop
  # for, and spends no runner time on a site docs.yml rebuilds anyway. A site
  # problem (12.0.0 waited on a docs-next install that needed a Lens release
  # first) can no longer hold a release PR. Every other PR and every push to
  # main still runs this job.
  docs:
    if: >-
      !(github.event_name == 'pull_request' &&
        github.head_ref == 'release/next' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-next/package-lock.json

      - name: Install root deps
        run: npm ci --no-audit

      # docs-next's prebuild generators import the built library through file:...
      - name: Build library (dist for the docs generators)
        run: npm run build

      - name: Install docs-next deps
        working-directory: docs-next
        run: npm ci --strict-peer-deps --no-audit

      # The "Try it live" embed runs this builder in the reader's browser. The
      # deploy (docs.yml) checks it too — too late: npm already has the version.
      - name: Check the Try-it demo runs end-to-end
        working-directory: docs-next
        run: npm run check:tryit

      # Built as the STATIC EXPORT, with the same root-path env docs.yml
      # deploys with, so this job measures the artifact that actually ships
      # instead of a near-miss of it. Same page render, same twoslash gate.
      - name: Build docs-next static export (twoslash-gates every code block)
        working-directory: docs-next
        env:
          EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run build

      # Site-budget RATCHET, on every PR and push — where site growth is caught:
      # in the change that causes it. It runs here because the export is
      # already built two steps up, so the marginal cost is one second of
      # stat()ing files. The same check runs in docs.yml before each deploy.
      #
      # WHAT THIS GUARANTEES: the commit that pushes the export over a ceiling
      # is red at the moment it is proposed, in the check people already read,
      # with the measured bytes in the log — rather than days and releases
      # later when someone thinks to open Deploy Docs.
      #
      # WHAT IT DOES NOT DO, on purpose: stop a release. publish.yml no longer
      # builds the site (a budget kept 9.87.0, 9.92.0 and 9.101.0 off npm), and
      # the release PR skips this job. Over budget at release time, the site
      # waits — docs.yml refuses to deploy it — and the npm version does not.
      - name: Enforce site performance budgets
        working-directory: docs-next
        run: npm run check:site-budget

      - name: Compare regenerated API pages
        run: git diff --exit-code HEAD -- docs-next/content/docs/api

  # Generated files are committed, so they must be regenerated WITH the change
  # that made them stale: the API mirror, the examples
  # README, the AI-instruction copies. `docs:check` regenerates everything and
  # fails on any diff — the fix is always `npm run docs:regen` + commit.
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run docs:check

  # Change fragments — every PR that touches src/ adds a .changes/*.md file
  # (see .changes/README.md). The release folds them into CHANGELOG.md and
  # picks the version, so nobody edits either by hand.
  # The release PR (branch release/next, opened by the Release workflow from
  # this repository) is the one change that SHOULD write a CHANGELOG version
  # heading and consume fragments, so it is exempt. A fork's branch of the same
  # name is not.
  changes:
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'release/next' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: node scripts/changes.mjs check --base origin/${{ github.base_ref }}

  # Doc-links gate — every internal cross-reference in docs-next must resolve.
  # Hand-written guides link by stable id (doc:<id>, resolved at build by
  # lib/remark-doc-links.mjs); this re-derives the id->route index from the
  # filesystem and fails on any dead id or stale #anchor. A page moved between
  # taxonomy folders, or a reworded heading, can therefore never ship a broken
  # link. github-slugger is already pinned by the root lockfile.
  docs-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/check-doc-links.mjs --strict

  # Docs-truth RATCHET — asks "do the docs describe what the code actually does?"
  # for every symbol in the real export map (package.json "exports" → shipped
  # .d.ts, because TypeDoc's single entry point cannot see subpath symbols) and
  # every event in ALL_EVENT_TYPES.
  #
  # Deliberately a ratchet, NOT a gate: the repo has hundreds of pre-existing
  # doc gaps recorded in docs/docs-truth/baseline.json, and failing on those
  # would put this job red on day one and get it deleted in a week. It fails
  # only when the gap gets BIGGER — a new export or event with no prose
  # description — plus one zero-tolerance class that is never baselined: the
  # published docs telling a reader to import something that does not exist.
  # Contributors get the re-baseline command in the failure output.
  #
  # Needs the build: the DECLARED column reads dist/, i.e. what actually ships.
  docs-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - id: build
        run: npm run build
      - run: npm run docs:truth
      # The full report is derived, not committed (.gitignore says why): it is
      # written here and attached to the run, with its summary on the run page.
      # These steps run even when the ratchet above is red, because that is exactly
      # when the report is wanted; `--report-only` writes it and then gives the
      # ratchet's own verdict again. They do NOT run after a failed build or in a
      # cancelled run: a report built from a half-built tree can read "no
      # regression" under a red job.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run docs:truth:report
      - name: Put the report's summary on the run page
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          awk '/^## In plain words/{on=1; print; next} on && /^## /{exit} on' docs/DOCS_TRUTH_REPORT.md > "$RUNNER_TEMP/docs-truth-summary.md"
          test -s "$RUNNER_TEMP/docs-truth-summary.md"
          cat "$RUNNER_TEMP/docs-truth-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-truth-report
          path: docs/DOCS_TRUTH_REPORT.md
          if-no-files-found: error
          # A re-run's report replaces the last attempt's (see coverage-blob below).
          overwrite: true
          retention-days: 30

  # Coverage gate — runs vitest with v8 coverage, reported in the merged job.
  # No threshold enforcement (per design memo).
  #
  # Split like the test run: each shard records its results and coverage in a
  # blob, and `coverage` below merges them. A shard's own log prints only its
  # partial figures; the merged figures are the ones that count.
  coverage-shard:
    if: github.event_name != 'pull_request' || github.head_ref == 'release/next' || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # Naming a reporter turns off vitest's two defaults, so all three are named.
      - run: |
          npm run test:coverage -- --shard=${{ matrix.shard }}/4 \
            --reporter=default --reporter=github-actions \
            --reporter=blob --outputFile.blob=vitest-blobs/shard-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: vitest-blobs/
          if-no-files-found: error
          # A re-run's blob replaces the last attempt's. Left with two of one name,
          # the download picks the higher artifact id, which is not the newer one.
          overwrite: true
          retention-days: 1

  # The required check `coverage`, by that exact name. It judges the merge of all
  # the shards, and `if: always()` plus the first step fail closed exactly as in
  # `test` above: unless every shard succeeded, nothing below that step runs.
  coverage:
    if: always() && (github.event_name != 'pull_request' || github.head_ref == 'release/next' || startsWith(github.head_ref, 'renovate/'))
    needs: coverage-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every shard succeeded
        env:
          COVERAGE_SHARD: ${{ needs.coverage-shard.result }}
        run: |
          echo "coverage-shard: $COVERAGE_SHARD"
          [ "$COVERAGE_SHARD" = success ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          path: vitest-blobs
          merge-multiple: true

      # Vitest merges whatever blobs it finds, and with one missing it reports
      # the rest and exits 0. So all four are named here.
      - name: Every shard's blob arrived
        run: ls -l vitest-blobs/shard-{1,2,3,4}.json
      - run: npm run test:coverage -- --merge-reports=vitest-blobs

  # The tree this run tested, recorded where the Release workflow can read it
  # back. Every job here that reads the code checks out the same commit — for a
  # pull request, the merge of its head into main as main stood when the run
  # began (a re-run reuses it) — so this is the tree every gate in the run tested,
  # shards included. No checkout in this file may name a `ref:`, or that would
  # stop being true.
  #
  # publish.yml's `verdict` skips the release's own run of the gates only when
  # this tree is byte for byte the tree it is about to publish. The hash goes
  # into a step NAME, which the Jobs API returns as rendered: the runner
  # renders it from this file and the `tree` step's output, and this job runs
  # no dependency code that could write that output. Not a log line or an
  # annotation: any process in any job, an install script included, can print
  # one of those.
  tested-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: tested tree ${{ steps.tree.outputs.hash }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: echo "This run tested tree $TREE."
