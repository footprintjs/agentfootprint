name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run on its previous head. Pushes to main
# are never cancelled: each one is a commit the Release workflow may cut.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# EVERY install here is `npm ci` against the committed lockfiles — the same
# tree the Release workflow gates and publishes. `npm install` would resolve
# fresh versions and let CI pass on a tree that never ships.
#
# This run's verdict is a release gate: when the release PR's run is green on
# the exact tree that merges, the Release workflow publishes without running
# the gates again (publish.yml · verdict, which reads `tested-tree` below). So
# every action here is pinned to a full commit SHA, as in publish.yml: a moved
# tag could otherwise report a tree as tested that never was. Renovate's
# github-actions manager proposes new pins.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      # Compile-level regression tests (test/type-regressions/) — ordinary
      # `test/**` isn't covered by the tsc run above (tsconfig.json's
      # `include` is src/**/* only), so type-only assignability breaks (e.g.
      # a recorder handle drifting out of CombinedRecorder's shape) can slip
      # through even with the runtime suite green. Its own tsconfig runs the
      # real compiler over just these files.
      - run: npm run test:types
      # Build BEFORE test: tests and examples import from the package name
      # 'agentfootprint' (not relative paths), and Node's resolver looks up the
      # local package's main/exports, which point to dist/.
      - run: npm run build
      - run: npm test
      # Every example, typechecked AND run end-to-end against mock providers —
      # the code people copy. Once per commit (the Node 22 leg) is enough.
      - if: matrix.node-version == 22
        run: npm run test:examples
      - run: npm run test:context-package
      # Packaging-correctness gate: dual CJS/ESM types resolve in every consumer mode.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

  # Also the two checks the Release workflow runs that nothing else in CI did —
  # a PR green here must not go red at release time.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - name: Documentation check (removed API names)
        run: bash scripts/check-docs.sh
      - name: Duplicate type check
        run: node scripts/check-dup-types.mjs
      # The layer table (scripts/layering.config.cjs): fails on ANY upward runtime import
      # (the fence is closed), on an upward type-only import not named in
      # TYPE_ONLY_ALLOWANCES or a stale entry there (the list only shrinks), on a folder
      # at two layers, on logic in a barrel, and on a value-level folder cycle.
      - name: Layering check
        run: npm run check:layering

  # Docs gate: builds docs-next (Fumadocs), which twoslash-compiles every
  # "ts twoslash" code block against the real agentfootprint types at build.
  # A snippet using a renamed/removed API fails the build -> hand-written doc
  # code can't drift from the library (the test job runs every example).
  #
  # NOT on the release PR (release/next, from this repository — a fork's
  # branch of that name still runs it). The website does not gate npm: the
  # release PR changes no page and no library source (the version, CHANGELOG,
  # CAPABILITIES, lockfiles), and docs.yml builds and checks the site again
  # once npm has the version, where a failure delays only the website.
  # Skipped rather than run as non-blocking: GitHub documents that a job
  # skipped by `if:` reports Success and does not block a merge even when it
  # is a required check, so the release PR shows no red site check to stop
  # for, and spends no runner time on a site docs.yml rebuilds anyway. A site
  # problem (12.0.0 waited on a docs-next install that needed a Lens release
  # first) can no longer hold a release PR. Every other PR and every push to
  # main still runs this job.
  docs:
    if: >-
      !(github.event_name == 'pull_request' &&
        github.head_ref == 'release/next' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-next/package-lock.json

      - name: Install root deps (docs-next resolves agentfootprint via a local dep)
        run: npm ci

      # docs-next's prebuild generators (gen-agent-flowchart / gen-replay-trace) import
      # agentfootprint at runtime → need dist/esm. Build the library first, like docs.yml.
      - name: Build library (dist for the docs generators)
        run: npm run build

      - name: Install docs-next deps
        working-directory: docs-next
        run: npm ci

      # The "Try it live" embed runs this builder in the reader's browser. The
      # deploy (docs.yml) checks it too — too late: npm already has the version.
      - name: Check the Try-it demo runs end-to-end
        working-directory: docs-next
        run: npm run check:tryit

      # Built as the STATIC EXPORT, with the same root-path env docs.yml
      # deploys with, so this job measures the artifact that actually ships
      # instead of a near-miss of it. Same page render, same twoslash gate.
      - name: Build docs-next static export (twoslash-gates every code block)
        working-directory: docs-next
        env:
          EXPORT: 'true'
        run: npm run build

      # Site-budget RATCHET, on every PR and push — where site growth is caught:
      # in the change that causes it. It runs here because the export is
      # already built two steps up, so the marginal cost is one second of
      # stat()ing files. The same check runs in docs.yml before each deploy.
      #
      # WHAT THIS GUARANTEES: the commit that pushes the export over a ceiling
      # is red at the moment it is proposed, in the check people already read,
      # with the measured bytes in the log — rather than days and releases
      # later when someone thinks to open Deploy Docs.
      #
      # WHAT IT DOES NOT DO, on purpose: stop a release. publish.yml no longer
      # builds the site (a budget kept 9.87.0, 9.92.0 and 9.101.0 off npm), and
      # the release PR skips this job. Over budget at release time, the site
      # waits — docs.yml refuses to deploy it — and the npm version does not.
      - name: Enforce site performance budgets
        working-directory: docs-next
        run: npm run check:site-budget

  # Generated files are committed, so they must be regenerated WITH the change
  # that made them stale: the API mirror, the docs-truth report, the examples
  # README, the AI-instruction copies. `docs:check` regenerates everything and
  # fails on any diff — the fix is always `npm run docs:regen` + commit.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run docs:check

  # Change fragments — every PR that touches src/ adds a .changes/*.md file
  # (see .changes/README.md). The release folds them into CHANGELOG.md and
  # picks the version, so nobody edits either by hand.
  # The release PR (branch release/next, opened by the Release workflow from
  # this repository) is the one change that SHOULD write a CHANGELOG version
  # heading and consume fragments, so it is exempt. A fork's branch of the same
  # name is not.
  changes:
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'release/next' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: node scripts/changes.mjs check --base origin/${{ github.base_ref }}

  # Doc-links gate — every internal cross-reference in docs-next must resolve.
  # Hand-written guides link by stable id (doc:<id>, resolved at build by
  # lib/remark-doc-links.mjs); this re-derives the id->route index from the
  # filesystem and fails on any dead id or stale #anchor. A page moved between
  # taxonomy folders, or a reworded heading, can therefore never ship a broken
  # link. Self-contained: github-slugger is the script's only external dep.
  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: npm install --no-save github-slugger
      - run: node scripts/check-doc-links.mjs --strict

  # Docs-truth RATCHET — asks "do the docs describe what the code actually does?"
  # for every symbol in the real export map (package.json "exports" → shipped
  # .d.ts, because TypeDoc's single entry point cannot see subpath symbols) and
  # every event in ALL_EVENT_TYPES.
  #
  # Deliberately a ratchet, NOT a gate: the repo has hundreds of pre-existing
  # doc gaps recorded in docs/docs-truth/baseline.json, and failing on those
  # would put this job red on day one and get it deleted in a week. It fails
  # only when the gap gets BIGGER — a new export or event with no prose
  # description — plus one zero-tolerance class that is never baselined: the
  # published docs telling a reader to import something that does not exist.
  # Contributors get the re-baseline command in the failure output.
  #
  # Needs the build: the DECLARED column reads dist/, i.e. what actually ships.
  docs-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run docs:truth

  # Coverage gate — runs vitest with v8 coverage; uploads lcov to Codecov.
  # No threshold enforcement (per design memo); badge surfaces the number
  # so it stays visible without becoming a hostage to chasing the metric.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The tree this run tested, recorded where the Release workflow can read it
  # back. Every job here checks out the same commit — for a pull request, the
  # merge of its head into main as main stood when the run began (a re-run
  # reuses it) — so this is the tree every gate in the run tested. No checkout
  # in this file may name a `ref:`, or that would stop being true.
  #
  # publish.yml's `verdict` skips the release's own run of the gates only when
  # this tree is byte for byte the tree it is about to publish. The hash goes
  # into a step NAME, which the Jobs API returns as rendered: the runner
  # renders it from this file and the `tree` step's output, and this job runs
  # no dependency code that could write that output. Not a log line or an
  # annotation: any process in any job, an install script included, can print
  # one of those.
  tested-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: tested tree ${{ steps.tree.outputs.hash }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: echo "This run tested tree $TREE."
