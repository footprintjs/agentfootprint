name: Docs Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This advisory check is independent of the required CI checks and release verdict.
jobs:
  docs-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-demo/package-lock.json

      - name: Check the Pages bundle selection and fallback
        run: python3 -B -m unittest discover -s .github/scripts -p test_deploy_docs_demo.py

      - name: Install the locked demo cohort
        working-directory: docs-demo
        run: npm ci --strict-peer-deps --no-audit

      - name: Install the locked browser revision
        working-directory: docs-demo
        run: npx --no-install playwright-core install --with-deps --only-shell chromium

      - name: Verify the generated figure and smoke-test the demo
        working-directory: docs-demo
        run: npm run check

      - name: Upload the checked demo bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-demo-${{ github.run_attempt }}
          path: docs-demo/dist/
          if-no-files-found: error
          retention-days: 14
