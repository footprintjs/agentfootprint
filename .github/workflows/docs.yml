name: Deploy Docs

# Builds the docs-next site (homepage + Fumadocs docs) as a static export and deploys
# it to the custom GitHub Pages domain at https://agentfootprint.dev/.
on:
  push:
    branches: [main]
    paths:
      - 'docs-next/**'
      - 'src/**' # API reference is generated from source
      - 'scripts/gen-fumadocs-api.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # The library itself: docs-next's twoslash code-checks and the generated API
      # reference both resolve against agentfootprint's built types (dist/), so build it.
      - name: Install library deps
        run: npm ci
      - name: Build library (dist types for twoslash + API gen)
        run: npm run build

      - name: Install docs-next deps
        working-directory: docs-next
        run: npm ci

      # The "Try it live" embed shows AND runs the same builder file. Run it here so a
      # broken demo fails the build, not the reader's browser.
      - name: Check the Try-it demo runs end-to-end
        working-directory: docs-next
        run: npm run check:tryit

      # Static export for the custom domain. EXPORT=true flips next.config to
      # output:'export'. The custom domain serves this project at its origin root,
      # so NEXT_PUBLIC_BASE_PATH must stay empty; a /agentfootprint prefix makes
      # every CSS, JavaScript, asset, and internal navigation request return 404.
      #
      # This step also PRUNES the export: docs-next's `postbuild` runs
      # scripts/prune-export.mjs, which deletes the `__next._full.txt` that Next
      # writes beside every route's index.txt and that nothing in a static export
      # ever fetches — 676 files and 151.87 MB here, a fifth of what would
      # otherwise be uploaded. It is wired to the build rather than added as a
      # step of its own so that ci.yml and publish.yml, which build the same
      # export to measure it, cannot measure a tree this job does not deploy.
      # The evidence, the risk of a future Next changing its mind, and the symptom
      # that would show it had (client navigation degrading to full page loads)
      # are all in that script. Read it before changing what this step ships.
      - name: Build static export
        working-directory: docs-next
        env:
          EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run build

      - name: Enforce site performance budgets
        working-directory: docs-next
        run: npm run check:site-budget

      # GitHub Pages must not run Jekyll (it would drop the _next/ underscore dir).
      - name: Disable Jekyll
        run: touch docs-next/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-next/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
