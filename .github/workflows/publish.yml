name: Publish to npm

on:
  release:
    types: [published]

# Least privilege: NO id-token at the top level. OIDC publish power is granted ONLY to the
# `publish` job, which consumes the build job's pre-built artifact and does ZERO dependency
# resolution — so the unpinned `npm install` (in `build`) never shares a runtime with the
# registry token or `npm publish --provenance`.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No committed lockfile (platform-specific native deps). Build BEFORE test: examples
      # import from the package name 'agentfootprint', resolved via the local package's
      # exports → dist/, so they need an upstream build. This job has NO publish power.
      - run: npm install
      - run: npm run build
      - run: npm test

      # Docs-truth RATCHET — the SAME gate CI runs on every push (ci.yml, job
      # `docs-truth`). It lives here too because CI and the publish are wired to
      # DIFFERENT triggers: CI runs on `push`, this workflow on `release:
      # published`, and `release.sh` creates the GitHub release seconds after the
      # push — so the two run concurrently and npm never waited on a CI verdict.
      # A red ratchet used to reach the registry unopposed (9.58.0 shipped with
      # 20 undocumented exports and 2 undocumented events). Running it inside the
      # job the publish job already `needs:` makes that impossible regardless of
      # HOW the release was created — the script, the web UI, another machine, a
      # re-run. Free: this job has already done the `npm install` + `npm run
      # build` the check requires.
      - run: npm run docs:truth

      # Packaging-correctness gate — block a publish that would ship broken/masquerading types.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      # Site-budget RATCHET — the SAME check the Deploy Docs workflow runs
      # (docs.yml, step "Enforce site performance budgets"). It lives here for
      # exactly the reason docs-truth does: Deploy Docs is wired to a different
      # trigger and gates nothing, so its red has never been able to stop
      # anything. Twice now it hasn't. 9.72.0 and 9.73.0 shipped to npm over a
      # red ceiling on 2026-08-26; then 9.76.0 crossed all four ceilings at once
      # and 9.76.1, 9.77.0 and 9.78.0 shipped over them too, while the published
      # documentation site sat four days and three releases stale. Every one of
      # those publishes was green. The measured history is in the comment above
      # OUTPUT_LIMITS in docs-next/scripts/check-site-budget.mjs.
      #
      # WHAT THIS NOW GUARANTEES: no version reaches npm while the docs site is
      # over budget. This is the job `publish` needs:, so its failure withholds
      # the registry push, whatever created the release — release.sh, the web
      # UI, another machine, a re-run. The release stops with the measured bytes
      # in the log, and the fix is a commit (raise the ceiling with the history,
      # or trim the export) plus a re-run of this workflow.
      #
      # WHAT IT STILL CANNOT DO. (1) It cannot un-cut the tag: the git tag and
      # the GitHub release exist before this workflow starts, so a red budget
      # blocks the PUBLISH, not the tagging — recovery is fix + re-run, and the
      # version number is already spent. (2) It cannot catch a budget that goes
      # red between releases; ci.yml's docs job runs the same check on every
      # push and PR for that. (3) It does not deploy the site — Deploy Docs
      # still owns that and still has to go green on its own; this only makes it
      # impossible to ship a release while that job is doomed to fail. (4) It
      # measures THIS commit: a budget that goes red from a docs-only commit
      # landing after the release is a CI red, not a publish block.
      #
      # Cost, measured on CI run 33298113906 (ci.yml's docs job, same steps on
      # the same runner image): docs-next install 11s + static export 1m27s +
      # the check itself 1.5s ≈ 1m40s. It runs AFTER publint/attw so the gates
      # that cost seconds get to fail first, and BEFORE `npm pack` so a red
      # budget stops the job while nothing has been staged. `files` in
      # package.json is an allowlist that does not name docs-next, so the
      # 749 MB export cannot leak into the tarball.
      - name: Install docs-next deps (site-budget gate)
        working-directory: docs-next
        run: npm install
      - name: Build docs static export
        working-directory: docs-next
        env:
          EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: '/agentfootprint'
        run: npm run build
      - name: Enforce site performance budgets
        working-directory: docs-next
        run: npm run check:site-budget

      # Stage the EXACT publishable package, files-agnostically: npm computes the tarball
      # (honoring the complex `files` globs/negations), then we extract it. The staged dir
      # is byte-identical to what `npm pack` produces, so the publish job re-packs the same.
      - name: Stage published package
        run: |
          npm pack
          mkdir -p pkg
          tar -xzf ./*.tgz -C pkg --strip-components=1

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: pkg/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — granted to THIS job only
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Upgrade npm ITSELF (trusted publishing needs >= 11.5.1) — not the project's deps.
      # Pinned to the 11.x line: npm 12.0.0 went `latest` on 2026-07-08 with a broken
      # provenance path (MODULE_NOT_FOUND: sigstore) that fails `npm publish --provenance`.
      - run: npm install -g npm@11

      # Publishes the pre-built artifact. No node_modules, no dependency resolution.
      # Trusted publishing: no NODE_AUTH_TOKEN — npm authenticates via the GitHub OIDC token.
      - name: Publish to npm
        run: npm publish --provenance --access public
