name: Release

# THE release, as a release PULL REQUEST — so `main` can require pull requests
# and green checks, and the release still needs no person to prepare anything.
#
#   1. A PR carrying a .changes/ fragment merges to main. This workflow runs
#      (`propose`): it computes the next version from the fragments, writes the
#      CHANGELOG entry, bumps package.json, regenerates every generated doc, and
#      opens — or updates — ONE pull request, "chore: release vX.Y.Z", from the
#      branch `release/next`. More fragments merging later update the same PR.
#   2. That PR runs the full CI like any other PR. With auto-merge on, it merges
#      itself once CI is green; otherwise a person merges it.
#   3. Its merge puts a version on main that has no tag yet. This workflow runs
#      again (`publish` mode): EVERY gate against that exact tree, then tag,
#      GitHub release, `npm publish --provenance`, and the docs site — in that
#      order, each only after the one before it succeeded.
#
# Jobs:
#   plan     what does main need? `publish` when package.json names a version
#            with no tag; `propose` when fragments are waiting (or a bump was
#            asked for by hand); otherwise nothing. Pins the commit every later
#            job works on. Cheap — it runs on every push to main.
#   propose  builds the release commit (version, CHANGELOG, generated docs).
#            Runs npm ci and holds no write token.
#   release-pr  pushes that commit to `release/next` and opens the release PR
#            with the release GitHub App's token: a PR opened with GITHUB_TOKEN
#            would run no CI, and its required checks would never report.
#            Installs nothing.
#   build    every gate against the release tree, then stages the npm tarball.
#            No write power of any kind.
#   release  tag + GitHub release. Runs no npm install. Safe to re-run: a tag or
#            a release that already exists is skipped.
#   publish  `npm publish --provenance` of the tarball `build` staged. The ONLY
#            job with an OIDC token.
#   docs     deploys the docs site — AFTER npm has the version.
#
# A red gate publishes nothing, and nothing a person has to undo: the version
# on main simply stays untagged until a fixing PR merges (whose run publishes)
# or someone re-runs the failed job.
#
# SETUP (once): a GitHub App with Contents + Pull requests read/write, installed
# on this repository; its Client ID in the Actions VARIABLE
# RELEASE_APP_CLIENT_ID and its private key in the Actions SECRET
# RELEASE_APP_PRIVATE_KEY. For hands-off releases, turn on Settings → General →
# "Allow auto-merge". CONTRIBUTING.md § Releasing has the steps.
#
# The file keeps its name, publish.yml, ON PURPOSE: npm trusted publishing is
# bound to this workflow FILENAME. Renaming it breaks publishing until the
# trusted-publisher setting on npmjs.com is changed to match.
#
# The legacy trigger stays: a GitHub release published by a person runs the same
# gates + publish against that tag — only when the tag points at a commit main
# already has (`plan` asks the compare API), so a tag on any other commit, pushed
# by a person or with a leaked token, publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for the release PR. auto = computed from .changes/ fragments; patch/minor/major may raise it, never lower it.'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  release:
    types: [published]

# Least privilege: nothing at the top level. `release` gets contents write,
# `publish` gets id-token, `docs` gets actions write; `build` and `propose` —
# the jobs that install dependencies — get read and keep no credentials, and
# only `release-pr`, which installs nothing, holds the App token (scoped to
# contents + pull requests).
#
# No cache on the release path, restored or saved. Every run here is a
# default-branch run, so a cache it restored could have been written by any
# other default-branch run, and `build` stages the bytes `publish` signs.
# setup-node turns its npm cache on by itself once package.json names a
# `packageManager`, so each setup-node below says `package-manager-cache:
# false` instead of relying on that field staying absent. Every action is
# pinned to a full commit SHA, because a moved tag would run with this file's
# write and OIDC powers. Renovate's github-actions manager proposes new pins;
# its token needs the Workflows permission to push changes to this folder.
permissions:
  contents: read

# One run at a time for main, so two runs never compute the same version. GitHub
# keeps ONE pending run per group and cancels an older pending one — harmless
# here, since every run works from the TIP of main. The legacy path gets a group
# per tag, so a push to main can never cancel a tag that still needs publishing.
concurrency:
  group: release-${{ github.event_name == 'release' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Releases are cut from main only
        if: github.event_name != 'release' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Run the Release workflow on main (got $REF)."
          exit 1

      # The TIP of main, not the commit that triggered this run: runs queue
      # behind each other, and the tip is what the next step must describe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.ref || 'main' }}

      - id: plan
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            # The legacy path publishes what the tag points at, so that commit
            # must already be on main: compare says main is `ahead` of it, or
            # `identical`. Anything else (`behind`, `diverged`) publishes nothing.
            STATUS="$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)"
            if [ "$STATUS" != "ahead" ] && [ "$STATUS" != "identical" ]; then
              echo "::error::Tag $TAG points at $SHA, which main does not contain (compare: $STATUS). Nothing was published."
              exit 1
            fi
            echo "mode=publish" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node scripts/changes.mjs check
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "main names v$VERSION, which has no tag — publishing it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(find .changes -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          if [ "$count" -gt 0 ] || [ "$BUMP" != "auto" ]; then
            echo "mode=propose" >> "$GITHUB_OUTPUT"
            echo "$count .changes/ fragment(s) waiting — opening or updating the release PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Nothing to release: v$VERSION is tagged and no .changes/ fragments are waiting." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The commit `plan` pinned: the tip of main (or the release's tag), which
      # only a merged pull request or a maintainer moves. No credentials are
      # left in .git/config for the dependency install scripts below to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      # The tracked lock installs the exact published ContextFootprint dependency.
      - run: npm ci

      # The legacy path publishes whatever version package.json holds at the
      # tag — refuse a tag that names a different one, before any gate runs.
      - name: Tag matches package.json (legacy release path)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json ($PKG). Nothing was published."
            exit 1
          fi

      - run: npm run build

      # ── Gates — the same list scripts/release.sh runs locally ──────────
      - name: Documentation check (removed API names)
        run: bash scripts/check-docs.sh
      - name: Duplicate type check
        run: node scripts/check-dup-types.mjs
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit && npm run test:types
      # The instrumented run is a superset of `npm test` (see release.sh gate 4).
      - name: Tests (with coverage — the command CI's coverage job runs)
        run: npm run test:coverage
      - name: Examples (typecheck + run every one end-to-end)
        run: npm run test:examples
      # Generated files must match this exact tree — the release PR regenerated
      # them, and nothing may have drifted since.
      - name: Generated files are current
        run: npm run docs:check
      # Docs-truth RATCHET: no new export or event without prose, and never
      # docs that tell a reader to import something that does not exist.
      - name: Docs truth
        run: npm run docs:truth
      - name: Doc links
        run: |
          npm install --no-save github-slugger
          node scripts/check-doc-links.mjs --strict
      # Packaging correctness: the registry dependency through isolated packed
      # consumers, then dual CJS/ESM types in every consumer mode.
      - run: npm run test:context-package
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      # Site-budget RATCHET — no version reaches npm while the docs site is over
      # budget (the measured history is above OUTPUT_LIMITS in
      # docs-next/scripts/check-site-budget.mjs). Runs last: it costs ~1m40s.
      - name: Install docs-next deps (site-budget gate)
        working-directory: docs-next
        run: npm ci
      - name: Build docs static export
        working-directory: docs-next
        env:
          EXPORT: 'true'
        run: npm run build
      - name: Enforce site performance budgets
        working-directory: docs-next
        run: npm run check:site-budget

      # Stage the EXACT publishable package, files-agnostically: npm computes the
      # tarball (honoring the `files` globs/negations), then we extract it. The
      # publish job re-packs the same bytes.
      - name: Stage published package
        run: |
          npm pack
          mkdir -p pkg
          tar -xzf ./*.tgz -C pkg --strip-components=1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pkg/
          # Long enough to re-run `publish` after a registry outage.
          retention-days: 30

  release:
    needs: [plan, build]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag + GitHub release
    steps:
      # The commit the gates judged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # Idempotent, so "Re-run failed jobs" finishes a half-done release.
      - name: Tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already on origin — not pushed again."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      # The notes are the CHANGELOG section the release PR wrote. A release
      # created with this job's token does not fire `release: published`, so
      # this workflow is not re-entered.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists — not created again."
            exit 0
          fi
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest

  publish:
    needs: [build, release]
    # `release` is skipped on the legacy trigger (the tag already exists).
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — granted to THIS job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Upgrade npm ITSELF (trusted publishing needs >= 11.5.1) — not the project's deps.
      # Pinned to the 11.x line: npm 12.0.0 went `latest` on 2026-07-08 with a broken
      # provenance path (MODULE_NOT_FOUND: sigstore) that fails `npm publish --provenance`.
      - run: npm install -g npm@11

      # Publishes the pre-built artifact with its declared registry dependency.
      # No dependency resolution runs with publishing authority.
      # Trusted publishing: no NODE_AUTH_TOKEN — npm authenticates via the GitHub OIDC token.
      # If this step fails, the tag already exists: fix the cause and use
      # "Re-run failed jobs" — the staged tarball is kept for 30 days, and the
      # release job skips what it already did.
      - name: Publish to npm
        run: npm publish --provenance --access public

  # The site documents what npm serves, so it deploys only once npm has the
  # version (see docs.yml). On the legacy path, release.sh starts it itself.
  docs:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start the docs deploy
    steps:
      - name: Deploy the docs site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "${{ github.repository }}" --ref main

      # A PR may have merged a fragment while this release was publishing. Its
      # own run found an untagged version and deferred to this one, so ask
      # again now: `plan` opens the next release PR, or ends in seconds.
      - name: Propose the next release if fragments are waiting
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref main

  # Fragments are waiting: write the release onto `release/next` and open (or
  # update) the release PR. Its merge is what `publish` mode releases.
  #
  # Two jobs, ON PURPOSE. `propose` runs `npm ci`, so every dependency's install
  # script runs in it, and it holds no write token. `release-pr` holds the
  # release App's token and runs no dependency code: it pushes the commit
  # `propose` built and opens the PR. A token in the same job as an install
  # script is a token that script can read (.git/config, a later step's
  # environment, a process left running), and this App can push tags and create
  # releases — which the legacy `release` trigger would publish.
  propose:
    needs: plan
    if: needs.plan.outputs.mode == 'propose'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: The release App is configured
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::The release PR is opened by the release GitHub App, which is not configured: set the Actions variable RELEASE_APP_CLIENT_ID and the Actions secret RELEASE_APP_PRIVATE_KEY (CONTRIBUTING.md § Releasing). Nothing was released; the fragments stay on main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - name: Prepare version + CHANGELOG from .changes/
        id: prepare
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: node scripts/release-prepare.mjs --bump "$BUMP" --notes-out "$RUNNER_TEMP/notes.md"

      - run: npm run build

      # Every generated file (API mirror, docs-truth report, examples README,
      # AI-instruction copies), so the release PR carries docs that match the
      # version it names.
      - name: Regenerate docs for the new version
        run: npm run docs:generate

      # The release commit travels to `release-pr` as a git bundle: data, never
      # code it would run.
      - name: Bundle the release commit
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          BASE: ${{ needs.plan.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B release/next
          git add -A
          git commit -m "chore: release v$VERSION"
          mkdir -p "$RUNNER_TEMP/release-pr"
          git bundle create "$RUNNER_TEMP/release-pr/release.bundle" "$BASE..release/next"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release-pr/notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pr
          path: ${{ runner.temp }}/release-pr/
          retention-days: 1

  # Pushes `release/next` and opens (or updates) the release PR with the release
  # App's token: a PR opened with GITHUB_TOKEN would run no CI, and its required
  # checks would never report. Installs nothing and runs no repository script.
  release-pr:
    needs: [plan, propose]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA, like every action here. The token is scoped
      # to exactly what this job writes.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ steps.app.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pr
          path: ${{ runner.temp }}/release-pr

      # `release/next` belongs to this workflow: it is rebuilt from the tip of
      # main on every run, so a force-push is the point, not a hazard.
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.propose.outputs.version }}
          BASE: ${{ needs.plan.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/release-pr/release.bundle" "release/next:release/next"
          # The bundle is data from a job that ran dependency code: exactly one
          # commit on the commit `plan` pinned, or nothing is pushed.
          if [ "$(git rev-parse 'release/next^')" != "$BASE" ] || [ "$(git rev-list --count "$BASE..release/next")" != "1" ]; then
            echo "::error::The release bundle is not one commit on $BASE. Nothing was pushed."
            exit 1
          fi
          git push --force origin release/next
          {
            cat "$RUNNER_TEMP/release-pr/notes.md"
            echo
            echo "---"
            echo "Written by the Release workflow from the \`.changes/\` fragments on main. Merging this PR tags v$VERSION, publishes it to npm and deploys the docs site. More fragments merging to main update this PR."
          } > "$RUNNER_TEMP/body.md"
          PR="$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "chore: release v$VERSION" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head release/next --title "chore: release v$VERSION" --body-file "$RUNNER_TEMP/body.md"
          fi
          # Hands-off when the repository allows auto-merge: merges itself once
          # its required checks are green. Otherwise a person merges it.
          gh pr merge release/next --auto --squash ||
            echo "::notice::Auto-merge is not enabled for this repository — merge the release PR when its checks are green."
