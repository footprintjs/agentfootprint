name: Release

# THE release. It starts itself: every push to main that carries a .changes/
# fragment (a merged PR that changed src/) releases. It can also be started by
# hand — Actions → Release → Run workflow, or `gh workflow run publish.yml
# -f bump=auto` — e.g. to force a minor. Every step after the start is automatic:
#
#   plan     is there anything to release? Validates the fragments and pins the
#            exact commit every later job works on. Zero fragments = the run
#            ends here, green, having released nothing.
#   build    prepare the release IN THE TREE (version from .changes/ fragments,
#            CHANGELOG entry, capability rows, every generated doc), then run
#            EVERY gate against that exact tree, then stage the npm tarball.
#            No write power of any kind.
#   release  only after every gate is green: commit, tag, push, GitHub release.
#            Runs no npm install — never shares a runtime with a dependency's
#            install script. Every step is SAFE TO RE-RUN: one that already
#            happened (commit on main, tag, GitHub release) is skipped, so
#            "Re-run failed jobs" finishes a half-done release instead of
#            stranding a version on main that npm never got.
#   publish  `npm publish --provenance` of the tarball `build` staged. The ONLY
#            job with an OIDC token.
#   docs     deploy the docs site — AFTER npm has the version, so the site never
#            documents a release the registry does not serve.
#
# Why the gates come FIRST: the previous flow tagged, pushed and created the
# GitHub release, and only THEN ran these gates here — a red gate blocked the
# publish but the version number was already spent (9.72.0/9.73.0 and 9.76.0–
# 9.78.0 shipped over a red site budget; 9.58.0 over a red docs-truth). Now a
# red gate means nothing was committed, tagged or published.
#
# Nothing to prepare by hand: no version bump, no CHANGELOG edit, no "regenerate
# the API reference" commit. Pull requests add fragments (.changes/README.md);
# this workflow does the rest.
#
# The file keeps its name, publish.yml, ON PURPOSE: npm trusted publishing is
# bound to this workflow FILENAME. Renaming it breaks publishing until the
# trusted-publisher setting on npmjs.com is changed to match.
#
# The legacy trigger stays: a GitHub release published by a person (`npm run
# release:patch`, which runs scripts/release.sh locally) skips `prepare`/`release`
# and runs the same gates + publish against the tag.
on:
  # Auto-release. The release commit itself is pushed with GITHUB_TOKEN, which
  # triggers no workflow — so a release can never start another release.
  push:
    branches: [main]
    paths: ['.changes/**']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. auto = computed from .changes/ fragments; patch/minor/major may raise it, never lower it.'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  release:
    types: [published]

# Least privilege: nothing at the top level. `release` gets contents/actions
# write, `publish` gets id-token; `build` — the only job that installs
# dependencies — gets read.
permissions:
  contents: read

# Two releases can never race for the same version number. GitHub keeps ONE
# pending run per group and cancels an older pending one, so the legacy
# `release: published` path (a tag someone already cut) gets a group per tag:
# a fragment push arriving behind it must not cancel a tag that still needs
# publishing, and it does not compete for a version number anyway.
concurrency:
  group: release-${{ github.event_name == 'release' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Releases are cut from main only
        if: github.event_name != 'release' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on main (got ${{ github.ref }})."
          exit 1

      # The TIP of main, not the commit that triggered this run: runs queue
      # behind each other (concurrency below), and by the time this one starts
      # an earlier run may have pushed a release commit that already folded
      # this push's fragments. Working from the tip means that case finds zero
      # fragments and ends green, instead of releasing twice or failing a
      # non-fast-forward push.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.ref || 'main' }}

      - id: plan
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node scripts/changes.mjs check
          count=$(find .changes -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          if [ "$count" -gt 0 ] || [ "${{ inputs.bump || 'auto' }}" != "auto" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No .changes/ fragments on main — nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    env:
      PREPARE: ${{ github.event_name != 'release' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # The tracked lock installs the exact published ContextFootprint dependency.
      - run: npm ci

      # The legacy path publishes whatever version package.json holds at the
      # tag — refuse a tag that names a different one, before any gate runs.
      - name: Tag matches package.json (legacy release path)
        if: env.PREPARE != 'true'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json ($PKG). Nothing was published."
            exit 1
          fi

      # ── Prepare (automated release only) ────────────────────────────────
      - name: Prepare version + CHANGELOG from .changes/
        id: prepare
        if: env.PREPARE == 'true'
        run: node scripts/release-prepare.mjs --bump "${{ inputs.bump || 'auto' }}" --notes-out "$RUNNER_TEMP/notes.md"

      - run: npm run build

      # Every generated file (API mirror, docs-truth report, examples README,
      # AI-instruction copies), so the release commit carries docs that match
      # the version it names.
      - name: Regenerate docs for the new version
        if: env.PREPARE == 'true'
        run: npm run docs:generate

      # Captured BEFORE the gates run, so nothing a gate writes can leak into
      # the release commit. The gates below then judge exactly these bytes.
      # Everything lands OUTSIDE the checkout ($RUNNER_TEMP), so the capture
      # cannot capture itself.
      - name: Capture the release commit
        if: env.PREPARE == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release/notes.md"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/release/commit.patch"
          echo "${{ steps.prepare.outputs.version }}" > "$RUNNER_TEMP/release/version"
          git diff --cached --stat

      # ── Gates — the same list scripts/release.sh runs locally ──────────
      - name: Documentation check (removed API names)
        run: bash scripts/check-docs.sh
      - name: Duplicate type check
        run: node scripts/check-dup-types.mjs
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit && npm run test:types
      # The instrumented run is a superset of `npm test` (see release.sh gate 4).
      - name: Tests (with coverage — the command CI's coverage job runs)
        run: npm run test:coverage
      - name: Examples (typecheck + run every one end-to-end)
        run: npm run test:examples
      # Docs-truth RATCHET: no new export or event without prose, and never
      # docs that tell a reader to import something that does not exist.
      - name: Docs truth
        run: npm run docs:truth
      - name: Doc links
        run: |
          npm install --no-save github-slugger
          node scripts/check-doc-links.mjs --strict
      # Packaging correctness: the registry dependency through isolated packed
      # consumers, then dual CJS/ESM types in every consumer mode.
      - run: npm run test:context-package
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      # Site-budget RATCHET — no version reaches npm while the docs site is over
      # budget (the measured history is above OUTPUT_LIMITS in
      # docs-next/scripts/check-site-budget.mjs). Runs last: it costs ~1m40s.
      - name: Install docs-next deps (site-budget gate)
        working-directory: docs-next
        run: npm ci
      - name: Build docs static export
        working-directory: docs-next
        env:
          EXPORT: 'true'
        run: npm run build
      - name: Enforce site performance budgets
        working-directory: docs-next
        run: npm run check:site-budget

      # Stage the EXACT publishable package, files-agnostically: npm computes the
      # tarball (honoring the `files` globs/negations), then we extract it. The
      # publish job re-packs the same bytes.
      - name: Stage published package
        run: |
          npm pack
          mkdir -p pkg
          tar -xzf ./*.tgz -C pkg --strip-components=1

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: pkg/
          # Long enough to re-run `publish` after a registry outage; the tag
          # may already exist by then.
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: env.PREPARE == 'true'
        with:
          name: release
          path: ${{ runner.temp }}/release/
          retention-days: 30

  release:
    needs: [plan, build]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit + tag + GitHub release
    steps:
      # The commit the gates judged — the patch applies to exactly this tree.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Idempotent, so "Re-run failed jobs" finishes a half-done release:
      #   - main already carries THIS release commit (its parent is the commit
      #     the gates judged) → reuse it, do not commit again;
      #   - the tag already exists on origin → do not push it again.
      # Anything else on main is refused exactly as before.
      - name: Commit, tag, push
        env:
          PLAN_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          VERSION="$(cat "$RUNNER_TEMP/release/version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --depth=2 origin main
          if [ "$(git log -1 --format=%s origin/main)" = "chore: release v$VERSION" ] &&
             [ "$(git rev-parse origin/main^)" = "$PLAN_SHA" ]; then
            echo "main already carries chore: release v$VERSION — resuming after it."
            git checkout --quiet --detach origin/main
          else
            git apply --index "$RUNNER_TEMP/release/commit.patch"
            git commit -m "chore: release v$VERSION"
            # Fast-forward only. If main moved while the gates ran, this refuses —
            # the new commits were never gated. Nothing is lost: a push that
            # moved main with a fragment has queued its own run, which releases
            # from the new tip. A push without one: run the workflow by hand.
            if ! git push origin "HEAD:refs/heads/main"; then
              echo "::error::main moved while the release was being verified. Nothing was committed, tagged or published — the queued run (or a manual one) releases from the new tip."
              exit 1
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already on origin — not pushed again."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      # A release created with this job's token does not fire `release:
      # published`, so this workflow is not re-entered.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat "$RUNNER_TEMP/release/version")"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists — not created again."
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" --latest
          fi

  publish:
    needs: [build, release]
    # `release` is skipped on the legacy trigger (the tag already exists).
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — granted to THIS job only
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Upgrade npm ITSELF (trusted publishing needs >= 11.5.1) — not the project's deps.
      # Pinned to the 11.x line: npm 12.0.0 went `latest` on 2026-07-08 with a broken
      # provenance path (MODULE_NOT_FOUND: sigstore) that fails `npm publish --provenance`.
      - run: npm install -g npm@11

      # Publishes the pre-built artifact with its declared registry dependency.
      # No dependency resolution runs with publishing authority.
      # Trusted publishing: no NODE_AUTH_TOKEN — npm authenticates via the GitHub OIDC token.
      # If this step fails, the tag already exists: fix the cause and use
      # "Re-run failed jobs" — the staged tarball is kept for 30 days, and the
      # release job skips what it already did.
      - name: Publish to npm
        run: npm publish --provenance --access public

  # The site documents what npm serves, so it deploys only once npm has the
  # version (see docs.yml). On the legacy path, release.sh starts it itself.
  docs:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start the docs deploy (a push by GITHUB_TOKEN triggers no workflow)
    steps:
      - name: Deploy the docs site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "${{ github.repository }}" --ref main
