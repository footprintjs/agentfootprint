name: Time reply generated files
on:
  push:
    branches: [codex/time-zone-intent-20261106]
permissions:
  contents: read
jobs:
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:regen
      - run: npx vitest run test/api-conformance/door-surface.test.ts -u
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: time-reply-generated-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            docs-next/content/docs/api/
            docs-next/lib/generated-api-aliases.json
            docs/DOCS_TRUTH_REPORT.md
            examples/README.md
            AGENTS.md
            ai-instructions/
            test/api-conformance/door-surface.snapshot.json
          if-no-files-found: error
