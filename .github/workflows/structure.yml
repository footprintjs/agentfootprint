name: Advisory structure report
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure-report:
    uses: footprintjs/ci/.github/workflows/structure-report.yml@378ab4e25a73620619f423bf661c292fcb6de538
    with:
      tool_sha: 378ab4e25a73620619f423bf661c292fcb6de538
      source_sha: ${{ github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
