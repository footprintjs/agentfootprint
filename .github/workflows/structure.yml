name: Advisory structure report
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure-report:
    uses: footprintjs/ci/.github/workflows/structure-report.yml@cef818ab3c43db9542955ccd8bf7673fbe8474fa
    with:
      tool_sha: cef818ab3c43db9542955ccd8bf7673fbe8474fa
      source_sha: ${{ github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
