<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img"
     aria-label="agentfootprint — the moments of one agent turn, drawn as a circle. The user's message enters through the INPUT gate on the left. The loop then runs clockwise past five stations: the WINDOW gate (what the live context keeps), the context slots and the LLM call (observation only), the BEFORE-TOOL gate (every call, before dispatch), the tool actually running (observation only), the AFTER-TOOL gate (every result, before the model reads it), and the end of the iteration (observation only). When the model stops calling tools the answer leaves through the OUTPUT gate on the right. Five amber gates are the moments act() can change; purple watch-dots sit at every moment, including the ones with no gate, because watch attends all of them and cannot be switched off.">

  <defs>
    <style>
      .head  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 13px; letter-spacing: 0.20em; font-weight: 800; fill: #9CA3AF; }
      .name  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; letter-spacing: 0.14em; font-weight: 800; fill: #B45309; }
      .desc  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 11px; fill: #6B7280; }
      .watch { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.10em; font-weight: 700; fill: #7C3AED; }
      .lede  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 12px; font-weight: 600; fill: #6B7280; }
    </style>

    <g id="dot">
      <circle r="7" fill="rgba(124,58,237,0.20)" stroke="rgba(124,58,237,0.60)" stroke-width="1.2"/>
      <circle r="2.4" fill="#7C3AED"/>
    </g>
  </defs>

  <text x="700" y="38" text-anchor="middle" class="head">THE MOMENTS OF THE LOOP</text>

  <!-- ── the turn, as a ring ───────────────────────────────────── -->
  <circle cx="700" cy="300" r="160" fill="none" stroke="rgba(180,83,9,0.30)" stroke-width="2"/>

  <!-- direction of travel: clockwise -->
  <g fill="#B45309">
    <g transform="translate(761.2,152.2) rotate(22.5)"><polygon points="-6,-5 6,0 -6,5"/></g>
    <g transform="translate(847.8,361.2) rotate(112.5)"><polygon points="-6,-5 6,0 -6,5"/></g>
    <g transform="translate(638.8,447.8) rotate(202.5)"><polygon points="-6,-5 6,0 -6,5"/></g>
    <g transform="translate(552.2,238.8) rotate(292.5)"><polygon points="-6,-5 6,0 -6,5"/></g>
  </g>

  <!-- ── observation-only stations (watch, no gate) ─────────────── -->
  <g>
    <use href="#dot" x="700" y="140"/>
    <text x="652" y="122" text-anchor="end" class="desc">the model is called</text>

    <use href="#dot" x="860" y="300"/>
    <text x="882" y="297" class="desc">the tool actually runs</text>
    <text x="882" y="313" class="desc">(the work itself)</text>

    <use href="#dot" x="700" y="460"/>
    <text x="700" y="487" text-anchor="middle" class="desc">the iteration ends</text>

    <use href="#dot" x="540" y="300"/>
    <text x="518" y="297" text-anchor="end" class="desc">the three context slots</text>
    <text x="518" y="313" text-anchor="end" class="desc">are composed</text>
  </g>

  <!-- ── the five act gates ────────────────────────────────────── -->

  <!-- input — outside the loop, once per turn -->
  <g transform="translate(150,337)">
    <rect width="180" height="46" rx="10" fill="rgba(180,83,9,0.06)" stroke="rgba(180,83,9,0.55)" stroke-width="1.4"/>
    <use href="#dot" x="20" y="23"/>
    <text x="104" y="29" text-anchor="middle" class="name">input</text>
  </g>
  <text x="240" y="405" text-anchor="middle" class="desc">the message, before</text>
  <text x="240" y="421" text-anchor="middle" class="desc">the run commits it</text>
  <line x1="336" y1="360" x2="540" y2="360" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
  <polygon points="540,355 552,360 540,365" fill="#B45309"/>

  <!-- window — top left of the ring -->
  <g transform="translate(517,164)">
    <rect width="140" height="46" rx="10" fill="rgba(180,83,9,0.06)" stroke="rgba(180,83,9,0.55)" stroke-width="1.4"/>
    <use href="#dot" x="20" y="23"/>
    <text x="86" y="29" text-anchor="middle" class="name">window</text>
  </g>
  <text x="450" y="150" text-anchor="middle" class="desc">what the live</text>
  <text x="450" y="166" text-anchor="middle" class="desc">context keeps</text>

  <!-- before-tool — top right of the ring -->
  <g transform="translate(718,164)">
    <rect width="190" height="46" rx="10" fill="rgba(180,83,9,0.06)" stroke="rgba(180,83,9,0.55)" stroke-width="1.4"/>
    <use href="#dot" x="20" y="23"/>
    <text x="100" y="29" text-anchor="middle" class="name">before-tool</text>
  </g>
  <text x="1020" y="176" text-anchor="middle" class="desc">every call,</text>
  <text x="1020" y="192" text-anchor="middle" class="desc">before dispatch</text>

  <!-- after-tool — bottom right of the ring -->
  <g transform="translate(718,390)">
    <rect width="190" height="46" rx="10" fill="rgba(180,83,9,0.06)" stroke="rgba(180,83,9,0.55)" stroke-width="1.4"/>
    <use href="#dot" x="20" y="23"/>
    <text x="100" y="29" text-anchor="middle" class="name">after-tool</text>
  </g>
  <text x="1020" y="402" text-anchor="middle" class="desc">every result, before</text>
  <text x="1020" y="418" text-anchor="middle" class="desc">the model reads it</text>

  <!-- output — outside the loop, once per turn -->
  <path d="M 700 130 C 700 84, 760 74, 850 74 L 1058 74" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
  <polygon points="1058,69 1070,74 1058,79" fill="#B45309"/>
  <g transform="translate(1070,51)">
    <rect width="180" height="46" rx="10" fill="rgba(180,83,9,0.06)" stroke="rgba(180,83,9,0.55)" stroke-width="1.4"/>
    <use href="#dot" x="20" y="23"/>
    <text x="104" y="29" text-anchor="middle" class="name">output</text>
  </g>
  <text x="1160" y="119" text-anchor="middle" class="desc">the answer, before</text>
  <text x="1160" y="135" text-anchor="middle" class="desc">the caller gets it</text>
  <text x="880" y="60" text-anchor="middle" class="desc">no more tool calls</text>

  <!-- ── legend ────────────────────────────────────────────────── -->
  <g transform="translate(340,556)">
    <use href="#dot" x="0" y="-4"/>
    <text x="18" y="0" class="watch">WATCH</text>
    <text x="80" y="0" class="desc">every moment, and it cannot be switched off</text>
  </g>
  <g transform="translate(800,556)">
    <rect x="-8" y="-16" width="26" height="24" rx="6" fill="rgba(180,83,9,0.06)" stroke="rgba(180,83,9,0.55)" stroke-width="1.4"/>
    <text x="28" y="0" class="name">ACT</text>
    <text x="82" y="0" class="desc">these five, and only these five</text>
  </g>

  <text x="700" y="596" text-anchor="middle" class="lede">Tools do the work. Act decides about the work. Watch remembers both — and nothing can act without being watched.</text>
</svg>
